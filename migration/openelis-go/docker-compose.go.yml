# Adds the Go service ALONGSIDE the Java stack for parity / compatibility checks.
# It does NOT touch the nginx proxy — Java keeps serving every route. Go is
# exposed on its own port (:8090) so a parity check can hit BOTH Java and Go and
# compare responses (e.g. server-time timezone). This is a side-by-side harness,
# NOT a strangler cutover.
#
# Run together with the main stack, from the repo root:
#   docker compose -f docker-compose.yml -f migration/openelis-go/docker-compose.go.yml up -d --build
#
# Then compare (same TZ for both containers via the shared TZ env):
#   Java: https://<host>/api/OpenELIS-Global/rest/server-time   (authed, via proxy)
#   Go:   http://<host>:8090/rest/server-time                   (direct)

services:
    go.openelis.org:
        container_name: openelisglobal-go
        build:
            context: ./migration/openelis-go
            dockerfile: Dockerfile
        platform: linux/amd64
        ports:
            # Loopback-only — but the REASON changed with P0 auth, so do not
            # read this as "unauthenticated service, do not expose".
            #
            # The service now enforces authentication on every registered route
            # (common/web.Register is default-deny) and the c1 patient endpoints
            # that serve PHI are gated exactly as Java gates them, merge/details'
            # Reception role included. What is still missing is SESSION SHARING:
            # Java and Go each keep sessions in their own process memory, so a
            # user authenticated against one is anonymous to the other
            # (auth-adoption-plan.md §8.1). Until that is resolved the strangler
            # proxy cannot route real traffic here, which is what loopback
            # enforces. The parity harness runs on the host, so loopback is
            # sufficient for it.
            - "127.0.0.1:8090:8090"
        environment:
            # SAME TZ var the Java webapp uses (docker-compose.yml), so both
            # resolve the same zone id — that is the compatibility being checked.
            - TZ=${TZ:-UTC}
            - OE_GO_ADDR=:8090
            # a2: connect to the SAME Postgres as Java. On the shared compose
            # network the db is reachable by its container name at :5432 (the
            # host-published :15432 is only for host-run parity checks).
            - OE_DB_HOST=openelisglobal-database
            - OE_DB_PORT=5432
            - OE_DB_NAME=clinlims
            - OE_DB_USER=postgres
            - OE_DB_PASSWORD=admin
            # encryption.general.password, and it MUST match what the Java
            # webapp resolves that property to — volume/properties/common.properties
            # sets it to `kspass`.
            #
            # The two services share one database, and a site_information row
            # flagged `encrypted` holds jasypt ciphertext keyed on this
            # password. Leaving it unset does not fail at startup: the Go
            # service falls back to Spring's `dev` default and then answers 500
            # on the form and menu for every encrypted row, because it is
            # decrypting Java's ciphertext with the wrong key — and writes rows
            # Java cannot read back. Same failure in both directions, visible
            # only once someone creates an encrypted row.
            - OE_ENCRYPTION_PASSWORD=${OE_ENCRYPTION_PASSWORD:-kspass}
        depends_on:
            - openelisglobal-database
        networks:
            - default
        restart: unless-stopped
